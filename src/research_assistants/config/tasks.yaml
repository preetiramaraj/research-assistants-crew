research_problem_task:
  description: >
    Identify five different research projects you need to execute to answer the high level
    research question {research-question} based in the domain of {domain}. These research projects should
    be smaller in scope in comparison to the provided research question. Identify the 
    goals of these research projects that will help answer the high-level research question 
  expected_output: >
    Five different research project ideas that will contribute to answering the high level
    research question {research-question}
  agent: researcher

identify_novel_project_task:
  description: >
    You need to use the tavilysearchtool to survey research for each of the five projects, and find existing research that addresses similar problems as each of the five projects. Based on the results, identify
    and output the one research project that is the most novel. This idea must not have been pursued in depth already in the field of {domain} 
  expected_output: >
    ONLY the single research project description (out of the five you created) with the title, goal, detailed objectives and contribution that you have identified as novel and no other information
    CRITICAL: Your entire response MUST start with "<FINAL>" (first characters of the message)
    and MUST end with "</FINAL>" (last characters of the message).
    Do not include any other tokens outside the tags.
  agent: researcher

literature_review_task:
  description: >
    Read the text within the tags <FINAL></FINAL> from results/identify_novel_project.md and extract the final selected
    novel project. Then perform a targeted literature search by searching arxiv for papers AND using the tavilysearchtool specifically about that selected project using 5-10 key keywords/phrases + 2-4 short search queries: find relevant papers, surveys, and closely related prior work.
    Prefer peer-reviewed sources and recent work (last 5-7 years) but include seminal older papers if foundational. These papers must be situated in the domain of {domain}.
    Summarize their research and also writes 2-4 sentences of how the research relates to the original research project.
    IMPORTANT: This is a discovery-only step. Do NOT download any PDFs in this task.
    First, output the exact research project description you read from results/identify_novel_project.md.
    Then, output each paper in a machine-parseable format with labeled fields exactly as: Title, Authors, Year, DOI, arXiv, Link, Summary, Relevance.
  expected_output: >
    Start with the research project description you were provided from before.
    Then list Twenty research papers formatted as markdown without '```'.
    IMPORTANT: Each paper entry MUST start with a heading line exactly like: ### Paper 1
    For each paper, include these labeled fields on separate lines:
    Title: ...
    Authors: ...
    Year: ...
    DOI: ... (or DOI: N/A)
    arXiv: ... (or arXiv: N/A)
    Link: ...
    Summary: ...
    Relevance: ...
  agent: literature_reviewer

download_pdfs_task:
  description: >
    Read results/literature_review.md and download PDFs for every paper listed there (including arXiv and non-arXiv) into the local PDF folder.
    Use the PDF download tool. Do not change the paper list; only download and report outcomes.
  expected_output: >
    A markdown download report listing each paper title and whether its PDF was downloaded, skipped, or failed, including saved file paths.
  agent: pdf_downloader
