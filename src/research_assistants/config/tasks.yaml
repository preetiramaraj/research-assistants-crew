research_problem_task:
  description: >
    Identify five different research projects you need to execute to answer the high level
    research question {research-question} based in the domain of {domain}. These research projects should
    be smaller in scope in comparison to the provided research question. Identify the 
    goals of these research projects that will help answer the high-level research question 
  expected_output: >
    Five different research project ideas that will contribute to answering the high level
    research question {research-question}
  agent: researcher


create_search_queries_task:
  description: >
    Read the project description from the previous task. Then create 5 search queries with no more than two search terms/keywords separated by AND relevant to the 
    project description. These search queries should be optimized for retrieving relevant related research in the field of {domain}.
    An example of a search query is: "search term 1" AND "search term 2"
  expected_output: >
    A list of 5 search queries with key phrases and keywords to find literature related to the current project.
  agent: literature_reviewer
literature_review_task:
  description: >
   Read the first search query from the previous task's output. Use only the one query to search Semantic Scholar for relevant papers and surveys using the semantic_scholar_search tool.
   IMPORTANT: Make exactly ONE call to the semantic_scholar_search tool with limit=10 to get all papers at once. Do not make multiple calls or search with different query variations. If the tool returns 'No papers found for query: [query]', output the following markdown message: '# No papers found\n\nNo matching papers were found for the given search query.'
   IMPORTANT: This is a discovery-only step. Do NOT download any PDFs in this task.
  expected_output: >
    List ten research papers formatted as markdown without '```'.
    IMPORTANT: Each paper entry MUST start with a heading line exactly like: ### Paper 1
    For each paper, include these labeled fields on separate lines:
    Title: ...
    Authors: ...
    Year: ...
    DOI: ... (or DOI: N/A)
    arXiv: ... (or arXiv: N/A)
    Link: ...
    Citation Count: ...
    Open Access PDF: ... (or Open Access PDF: N/A)
  agent: literature_reviewer

download_pdfs_task:
  description: >
    Read results/literature_review.md and download PDFs for every paper listed there (including arXiv and non-arXiv) into the local PDF folder.
    Use the PDF download tool. Do not change the paper list; only download and report outcomes.
  expected_output: >
    A markdown download report listing each paper title and whether its PDF was downloaded, skipped, or failed, including saved file paths.
  agent: pdf_downloader
